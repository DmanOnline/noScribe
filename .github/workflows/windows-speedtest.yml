name: windows-speedtest

# Measures how long the built Windows app takes on long Dutch audio, separately
# from the build. Uses the app from the latest successful windows-build run
# (or the run id you enter), so nothing is rebuilt.
#
# The runner has 4 CPU cores and 16 GB RAM, about a business laptop. The audio
# is ten minutes of Dutch speech (FLEURS, several speakers, known text); speaker
# detection is on, as a user would run it. Results appear in the run summary.
on:
  # A tag starts it too, e.g.  git tag speedtest-1 && git push origin speedtest-1
  # (needed as long as this workflow is not on the default branch).
  push:
    tags:
      - "speedtest*"
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "windows-build run id (empty = latest successful)"
        required: false
        default: ""
      models:
        description: "Models to test, comma-separated"
        required: false
        default: "local-canary:canary-1b-v2,local-whisper:fast"

permissions:
  contents: read
  actions: read   # to download the app from the build run

jobs:
  speedtest:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v6

      - name: Find build run
        id: run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $id = "${{ inputs.build_run_id }}"
          if (-not $id) {
            $id = gh run list -R ${{ github.repository }} --workflow windows-build --status success --limit 1 --json databaseId --jq '.[0].databaseId'
          }
          if (-not $id) { throw "No successful windows-build run found" }
          "Using windows-build run $id"
          "id=$id" >> $env:GITHUB_OUTPUT

      - name: Download app
        uses: actions/download-artifact@v4
        with:
          name: noScribe-windows-cpu
          path: app
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}

      - name: Set up Python (for the test audio and scoring only)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore test audio
        id: fleurs
        uses: actions/cache@v4
        with:
          path: fleurs
          key: fleurs-nl-test

      - name: Prepare 10 min Dutch audio
        shell: pwsh
        run: |
          pip install jiwer pyarrow soundfile numpy huggingface_hub
          if (-not (Test-Path fleurs/parquet-data/nl_nl/test-00000-of-00001.parquet)) {
            python -c "from huggingface_hub import hf_hub_download as d; d('google/fleurs','parquet-data/nl_nl/test-00000-of-00001.parquet',repo_type='dataset',local_dir='fleurs')"
          }
          python tools/speedtest.py make --fleurs fleurs/parquet-data/nl_nl/test-00000-of-00001.parquet --n 60 --out speedtest

      - name: Run speed test
        shell: pwsh
        run: |
          $audioMin = 10.3
          $cpu = (Get-CimInstance Win32_Processor | Select-Object -First 1).Name
          "## Windows speed test" >> $env:GITHUB_STEP_SUMMARY
          "$cpu, 4 cores, CPU only. 10.3 min Dutch audio, several speakers, speaker detection on. Build run ${{ steps.run.outputs.id }}." >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "| Model | Time | Per hour of audio | Word errors |" >> $env:GITHUB_STEP_SUMMARY
          "|---|---|---|---|" >> $env:GITHUB_STEP_SUMMARY
          $models = "${{ inputs.models }}"
          if (-not $models) { $models = "local-canary:canary-1b-v2,local-whisper:fast" }
          foreach ($m in $models.Split(",")) {
            $m = $m.Trim()
            $name = $m.Split(":")[1]
            $out = "speedtest/$name.txt"
            $t = Measure-Command { app/noScribe.exe --no-gui --model $m --language nl --speaker-detection auto speedtest/speedtest_nl.wav $out | Out-Host }
            $wer = if (Test-Path $out) { python tools/speedtest.py score --ref speedtest/reference.txt --hyp $out } else { "failed" }
            $perHour = [math]::Round($t.TotalMinutes / $audioMin * 60, 0)
            "| $name | $([math]::Round($t.TotalMinutes, 1)) min | ~$perHour min | $wer% |" >> $env:GITHUB_STEP_SUMMARY
            "$name : $([math]::Round($t.TotalMinutes, 1)) min, ~$perHour min per hour of audio, WER $wer%"
          }

      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speedtest-transcripts
          path: speedtest/*.txt
          if-no-files-found: ignore
