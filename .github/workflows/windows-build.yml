name: windows-build

# Builds the Windows CPU version with Whisper "fast" (large-v3-turbo int8)
# bundled, plus a per-user installer (setup.exe). No NVIDIA GPU needed.
# Canary is not bundled: on Windows it was not faster than Whisper (speed test
# 12-11-2026) and with it the installer exceeds the 2 GB limit of NSIS.
#
# Not on every push, because a build takes a while. Start it by hand
# (Actions > windows-build > Run workflow) or push a version tag, e.g.
#   git tag v0.8-ma1 && git push origin v0.8-ma1
#
# Speed: the installed Python packages, the models and PyInstaller's work
# folder are cached. The caches are saved right after they are filled, so a
# failing test later in the run does not throw them away.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # to publish a release for a version tag

env:
  # PyInstaller's spec collects data from the noScribe package itself.
  PYTHONPATH: ${{ github.workspace }}
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The whole Python installation incl. site-packages; a hit skips pip.
      - name: Restore Python packages
        id: pycache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.pythonLocation }}
          key: py-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('environments/requirements_win_cpu.txt') }}

      - name: Install dependencies
        if: steps.pycache.outputs.cache-hit != 'true'
        run: pip install -r environments/requirements_win_cpu.txt

      - name: Save Python packages
        if: steps.pycache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.pythonLocation }}
          key: ${{ steps.pycache.outputs.cache-primary-key }}

      - name: Restore models
        id: modelcache
        uses: actions/cache/restore@v4
        with:
          path: models/fast
          key: models-fast-${{ hashFiles('tools/download_models.py') }}

      - name: Download models
        if: steps.modelcache.outputs.cache-hit != 'true'
        run: python tools/download_models.py --only fast

      - name: Save models
        if: steps.modelcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: models/fast
          key: ${{ steps.modelcache.outputs.cache-primary-key }}

      # PyInstaller's analysis cache; reused across commits.
      - name: Restore PyInstaller work folder
        id: pyicache
        uses: actions/cache/restore@v4
        with:
          path: build
          key: pyi-${{ hashFiles('environments/requirements_win_cpu.txt') }}-${{ github.sha }}
          restore-keys: |
            pyi-${{ hashFiles('environments/requirements_win_cpu.txt') }}-

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --workpath build --distpath dist pyinstaller/noScribe_win.spec

      - name: Save PyInstaller work folder
        if: steps.pyicache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build
          key: ${{ steps.pyicache.outputs.cache-primary-key }}

      - name: Check bundled models and plugins
        shell: pwsh
        run: |
          $base = "dist/noScribe/_internal"
          foreach ($f in @(
              "../noScribe.exe",
              "../noScribe-cli.exe",
              "models/fast/model.bin",
              "noScribe/plugins/local_canary/backend.json",
              "noScribe/plugins/local_whisper/backend.json",
              "trans/noScribe.nl.yml")) {
            if (-not (Test-Path "$base/$f")) { throw "Missing in build: $f" }
          }
          "{0:N0} MB" -f ((Get-ChildItem -Recurse dist/noScribe | Measure-Object Length -Sum).Sum / 1MB)

      - name: Smoke test, list models
        run: dist\noScribe\noScribe-cli.exe --help-models

      - name: Smoke test, Whisper fast to PDF (20 s, with speaker detection)
        shell: pwsh
        run: |
          dist\noScribe\noScribe-cli.exe --no-gui --model local-whisper:fast --language de --speaker-detection auto --stop 00:00:20 tests\data\interview.mp3 smoke_whisper.pdf
          if (-not (Test-Path smoke_whisper.pdf)) { throw "No PDF written" }

      # The installer: one setup.exe, installs per user (no admin rights needed),
      # with Start menu and desktop shortcuts.
      # The app as a user starts it: noScribe.exe has no console, so it must
      # open its own window. Fails if no "noScribe" window appears in 3 min.
      - name: Smoke test, app window opens
        shell: pwsh
        run: |
          $p = Start-Process dist\noScribe\noScribe.exe -PassThru
          $deadline = (Get-Date).AddMinutes(3)
          $title = ""
          while ((Get-Date) -lt $deadline -and -not $title) {
            Start-Sleep -Seconds 3
            $title = (Get-Process -Name noScribe -ErrorAction SilentlyContinue |
                      Where-Object { $_.MainWindowTitle -like "noScribe*" } |
                      Select-Object -First 1).MainWindowTitle
          }
          Get-Process -Name noScribe -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $title) { throw "The noScribe window did not appear within 3 minutes" }
          "Window opened: $title"

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: python tools/make_installer.py --dist dist/noScribe --out installer

      # Only a build that passed the tests is uploaded.
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: noScribe-setup
          path: installer/*.exe
          compression-level: 0
          retention-days: 30

      # A version tag (v...) publishes the installer as a GitHub Release, a
      # fixed download page that does not expire like artifacts do.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          noScribe voor Windows (alleen CPU, geen NVIDIA-kaart nodig), met Whisper large-v3-turbo.

          Installeren: download noScribe_setup en dubbelklik. Er zijn geen beheerdersrechten nodig.
          Daarna staat noScribe in het Startmenu en op het bureaublad.

          Nieuw ten opzichte van de originele noScribe: opnemen met de microfoon, PDF als uitvoer,
          Nederlandse interface, kleuren van Stichting Mijn Aansluiting, laptop blijft wakker tijdens
          opnemen en omzetten, snellere sprekerherkenning op de CPU.
          "@
          gh release create "${{ github.ref_name }}" installer/*.exe --repo "${{ github.repository }}" --title "noScribe ${{ github.ref_name }}" --notes $notes

      - name: Upload app folder (without installer)
        uses: actions/upload-artifact@v4
        with:
          name: noScribe-windows-cpu
          path: dist/noScribe
          compression-level: 0   # models and DLLs barely compress
          retention-days: 14

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: smoke_*
          if-no-files-found: ignore
