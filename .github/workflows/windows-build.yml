name: windows-build

# Builds the Windows CPU version with the models bundled (Canary 1B v2 and
# Whisper "fast"), as a folder you unzip and run. No NVIDIA GPU needed.
#
# Not on every push, because a build takes 30 to 60 minutes. Start it by hand
# (Actions > windows-build > Run workflow) or push a version tag, e.g.
#   git tag v0.8-ma1 && git push origin v0.8-ma1
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r environments/requirements_win_cpu.txt

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: |
            models/canary-1b-v2
            models/fast
          key: models-${{ hashFiles('tools/download_models.py') }}

      - name: Download models
        run: python tools/download_models.py

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean pyinstaller/noScribe_win.spec

      - name: Check bundled models
        shell: pwsh
        run: |
          Get-ChildItem -Recurse dist/noScribe/_internal/models | Select-Object FullName, Length | Format-Table -AutoSize
          if (-not (Test-Path dist/noScribe/_internal/models/canary-1b-v2/encoder-model.int8.onnx)) { throw "Canary missing" }
          if (-not (Test-Path dist/noScribe/_internal/models/fast/model.bin)) { throw "Whisper fast missing" }

      - name: Smoke test, list models
        run: dist\noScribe\noScribe.exe --help-models

      - name: Smoke test, transcribe 20 s with Canary to PDF
        shell: pwsh
        run: |
          dist\noScribe\noScribe.exe --no-gui --model local-canary:canary-1b-v2 --language de --speaker-detection none --stop 00:00:20 tests\data\interview.mp3 smoke.pdf
          if (-not (Test-Path smoke.pdf)) { throw "No PDF written" }
          Get-Item smoke.pdf

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: noScribe-windows-cpu
          path: dist/noScribe
          compression-level: 1
          retention-days: 14
