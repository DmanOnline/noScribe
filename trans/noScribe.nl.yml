  tooltip_speaker_names: |-
    Namen van de mensen in de opname, gescheiden door komma's (bijv. "Mona, Lena").
    Ze worden gekoppeld aan de sprekers in de volgorde waarin die voor het eerst praten,
    en vervangen de labels S00/S01 in het transcript.
  ask_speaker_names_count: 'Je hebt %{n_names} naam/namen ingevuld, maar het aantal sprekers staat op %{n_speakers}. De namen kunnen bij de verkeerde personen terechtkomen. Toch starten?'
  warn_speaker_names_more_speakers: 'Er zijn meer sprekers herkend dan er namen zijn ingevuld (%{n_names}). De extra sprekers krijgen een nummer, doorlopend na de genoemde sprekers in de volgorde waarin ze praten.'
