nl:
  app_header: Audio omzetten naar tekst met AI
  welcome_message: Hallo, noScribe is klaar voor gebruik!
  welcome_credits: >

    Versie %{v}, Kai Dröge %{y}

    macOS-versie door Philipp Schneider

    gebouwd op Whisper (OpenAI), faster-whisper (Guillaume Klein) & pyannote (Hervé Bredin)
  welcome_instructions: >

    Kies links een audiobestand, of neem direct op met de microfoonknop, en kies waar het transcript wordt opgeslagen.
    Heb wat geduld: het omzetten kan 2 tot 5 keer zo lang duren als de opname zelf. Test je instellingen eerst
    op een kort stuk voordat je de hele opname omzet. (Start = 00.00.00 en Stop = 00.03.00 zet
    de eerste 3 minuten om.)


    Veel succes!

  setup_message: 'Eerste keer opstarten: de installatie wordt afgerond...'
  new_release: 'Er is een nieuwe versie van noScribe beschikbaar (%{v}):'
  new_release_download: 'Downloaden: '

  # UI Elements
  tab_log: Logboek
  tab_queue: Wachtrij

  label_audio_file: 'Audiobestand:'
  label_audio_file_name: <kies een bestand>
  multiple_audio_files: '(meerdere bestanden gekozen)'

  label_transcript_file: 'Transcript opslaan als:'
