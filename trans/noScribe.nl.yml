    CUDA-fout bij pyannote. Nieuwe poging op de CPU. Dit geldt alleen voor deze taak.
    Zet force_pyannote_cpu: true in config.yml om altijd de CPU te gebruiken.
  whisper_cuda_retry: |-
    CUDA-fout bij Whisper. Nieuwe poging op de CPU. Dit geldt alleen voor deze taak.
    Zet force_whisper_cpu: true in config.yml om altijd de CPU te gebruiken.
  gpu_worker_crash_retry: |-
    Het %{component}-proces op de GPU is onverwacht gestopt (exitcode %{exitcode}, laatste stap: %{stage}). De oorzaak is onbekend. Deze taak wordt opnieuw geprobeerd op de CPU.
    Zet %{option}: true in config.yml om altijd de CPU te gebruiken.
