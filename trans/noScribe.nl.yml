  output_dir_selection: 'Meerdere audiobestanden: kies een map waarin de transcripten worden opgeslagen. De namen worden automatisch gemaakt.'
  output_format_selection: 'Meerdere audiobestanden: kies het bestandsformaat voor alle transcripten.'

  label_start: 'Start (uu:mm:ss):'
  label_stop: 'Stop (uu:mm:ss):'

  label_language: 'Taal:'
  label_speaker: 'Sprekers herkennen:'
